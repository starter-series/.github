name: Python CI
'on':
  workflow_call:
    inputs:
      repository:
        type: string
        default: ''
        description: Public repository to validate; defaults to caller.
      ref:
        type: string
        default: ''
        description: Empty uses caller event commit; fleet maintenance supplies main.
permissions:
  contents: read
jobs:
  security:
    uses: ./.github/workflows/reusable-security.yml
    with:
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.ref }}
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: ${{ inputs.repository || github.repository }}
        ref: ${{ inputs.ref }}
        persist-credentials: false
    - uses: starter-series/.github/.github/actions/setup-python@d326229e33c21461b1a79a49de6f95f4ea1f4aaf
      with:
        version: ${{ matrix.python }}
    - name: Deliverable-specific validation
      uses: ./.github/actions/validate
    strategy:
      fail-fast: false
      matrix:
        python:
        - '3.11'
        - '3.12'
        - '3.13'
  dependencies:
    uses: ./.github/workflows/reusable-dependency-audit.yml
    with:
      runtime: python
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.ref }}
