name: source-security
description: Starter Series central source-security
inputs: {}
runs:
  using: composite
  steps:
  - name: Scan for secrets
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    run: |
      set -euo pipefail
      curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
      echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
      tar xz -C /tmp -f /tmp/gitleaks.tgz
      /tmp/gitleaks detect --source . --verbose --redact
    shell: bash
  - name: Check for large files
    shell: bash
    run: |-
      LARGE=$(find . -not -path './.git/*' -not -path './node_modules/*' -not -path './.venv/*' -type f -size +5M)
      if [ -n "$LARGE" ]; then
        printf '%s\n' "$LARGE"
        echo '::error::Files exceed 5 MB'
        exit 1
      fi
