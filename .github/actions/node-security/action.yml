name: node-security
description: Starter Series central node-security
inputs: {}
runs:
  using: composite
  steps:
  - name: Audit all dependencies
    shell: bash
    run: npm audit --audit-level=high
  - name: Check installed licenses
    shell: bash
    run: npm exec --yes --package=license-checker-evergreen@6.3.1 -- license-checker-evergreen --failOn "GPL-2.0;GPL-3.0;AGPL-3.0"
    if: ${{ !cancelled() }}
  - name: Check lockfile licenses
    shell: bash
    run: node "$GITHUB_ACTION_PATH/../../../scripts/check-licenses.mjs"
    if: ${{ !cancelled() }}
